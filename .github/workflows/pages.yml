name: Compress PDFs and Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y ghostscript

      - name: Compress PDFs (prepress quality)
        run: |
          find . -name '*.pdf' -type f | while read pdf; do
            echo "Compressing: $pdf"
            dir=$(dirname "$pdf")
            base=$(basename "$pdf")
            gs -sDEVICE=pdfwrite \
               -dCompatibilityLevel=1.5 \
               -dPDFSETTINGS=/prepress \
               -dNOPAUSE -dBATCH -dQUIET \
               -sOutputFile="${dir}/.compressed_${base}" \
               "$pdf"

            original=$(stat -c%s "$pdf")
            compressed=$(stat -c%s "${dir}/.compressed_${base}")

            if [ "$compressed" -lt "$original" ]; then
              saved=$(( (original - compressed) * 100 / original ))
              echo "  Saved ${saved}% ($(( (original - compressed) / 1024 ))KB)"
              mv "${dir}/.compressed_${base}" "$pdf"
            else
              echo "  Already optimal, skipping"
              rm "${dir}/.compressed_${base}"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
